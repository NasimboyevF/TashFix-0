<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TashFix</title>
<script>
try{var t=localStorage.getItem('tf_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='light'}
</script>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e7e9f0;--hov:#f3f4fb;--ac:#4f46e5;--ac2:#8b5cf6;--danger:#e11d48;
--sh:0 1px 2px rgba(15,23,42,.04),0 10px 28px -14px rgba(15,23,42,.12);
--c-new:#94a3b8;--c-review:#f59e0b;--c-in_progress:#3b82f6;--c-resolved:#22c55e}
[data-theme=dark]{--bg:#090a0f;--card:#12141b;--tx:#f1f5f9;--mut:#8b93a7;--bd:#20232e;--hov:#191c26;--ac:#818cf8;--ac2:#a78bfa;--danger:#fb7185;
--sh:0 1px 0 rgba(255,255,255,.03) inset,0 14px 34px -18px rgba(0,0,0,.7)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
background:var(--bg) radial-gradient(800px 420px at 88% -8%,color-mix(in srgb,var(--ac) 14%,transparent),transparent) no-repeat;background-attachment:fixed;min-height:100vh}
a{color:inherit;text-decoration:none}.wrap{max-width:1080px;margin:0 auto;padding-left:24px;padding-right:24px}
header{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--bd);background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.nav{display:flex;align-items:center;gap:6px;height:64px}.sp{flex:1}
.logo{font-weight:700;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;margin-right:18px}
.mark{width:24px;height:24px;border-radius:8px;margin-right:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 4px 12px -2px color-mix(in srgb,var(--ac) 60%,transparent)}
.nav a.l{color:var(--mut);font-size:14px;font-weight:500;padding:7px 14px;border-radius:999px;transition:.15s}
.nav a.l:hover{color:var(--tx)}.nav a.l.on{background:var(--hov);color:var(--tx)}
main.wrap{padding-top:44px;padding-bottom:88px}
main>*{animation:up .4s ease both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:30px;letter-spacing:-.03em;margin:0 0 6px;font-weight:700}.sub{margin:0 0 30px;color:var(--mut)}
h3{font-size:12px;margin:0 0 18px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:24px;box-shadow:var(--sh)}
.grid{display:grid;gap:18px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}
@media(max-width:780px){.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.wrap{padding-left:16px;padding-right:16px}.logo{margin-right:6px}}
.stat{position:relative;overflow:hidden;padding:22px 24px}.stat:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
.stat .t{font-size:13px;color:var(--mut);font-weight:500;display:flex;align-items:center;gap:8px}
.stat .n{font-size:38px;font-weight:700;letter-spacing:-.04em;margin-top:6px;line-height:1.1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--mut));display:inline-block;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--mut)) 20%,transparent)}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;padding:4px 11px 4px 9px;border-radius:999px;
background:color-mix(in srgb,var(--c) 13%,transparent);color:color-mix(in srgb,var(--c) 70%,var(--tx))}
.pill .dot{box-shadow:none}.legend .pill{background:none;padding:0;color:var(--mut)}
.btn{font:inherit;font-size:14px;font-weight:500;border:0;color:#fff;border-radius:12px;padding:10px 18px;cursor:pointer;transition:.15s;
background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 8px 18px -8px color-mix(in srgb,var(--ac) 80%,transparent)}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:disabled{opacity:.5;transform:none}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}.btn.ghost:hover{background:var(--hov)}
.btn.danger{background:none;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 45%,transparent);box-shadow:none}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 10%,transparent)}
input,select,textarea{font:inherit;font-size:14px;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 14px;outline:none;width:100%;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 16%,transparent)}
.bar-row{display:grid;grid-template-columns:150px 1fr 36px;gap:14px;align-items:center;font-size:14px;margin-bottom:14px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}.bar i{display:block;border-radius:3px;min-width:6px}
.bar-row b{text-align:right;font-weight:600}.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:1px solid var(--bd);font-size:12.5px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin-bottom:18px}@media(max-width:780px){.filters{grid-template-columns:1fr}}
.tw{overflow-x:auto;padding:6px 0}table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.07em;padding:14px 20px;white-space:nowrap}
td{padding:16px 20px;border-top:1px solid var(--bd);vertical-align:middle}tbody tr{cursor:pointer;transition:background .12s}tbody tr:hover{background:var(--hov)}
.tchip{display:inline-flex;align-items:center;gap:12px;font-weight:500}
.tchip i{font-style:normal;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:17px;background:var(--hov);border:1px solid var(--bd)}
.mut{color:var(--mut)}.sm{font-size:13px}.num{font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px}
.err{color:var(--danger);font-size:14px;margin:8px 0}.ok{color:var(--c-resolved);font-size:14px;margin:8px 0}
.back{font-size:14px;color:var(--mut);display:inline-block;margin-bottom:20px}.back:hover{color:var(--tx)}.stack>*+*{margin-top:14px}
.hist{list-style:none;margin:0;padding:0 0 0 6px}.hist li{padding:0 0 18px 20px;border-left:2px solid var(--bd);position:relative}
.hist li:last-child{padding-bottom:0}.hist li:before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--mut));box-shadow:0 0 0 4px var(--card)}
img.ph{max-width:100%;max-height:380px;border-radius:14px;border:1px solid var(--bd)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:34px;box-shadow:var(--sh);animation:up .5s ease both}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===== адрес бэкенда на Render (без слэша в конце) =====
const API = 'https://tashfix-0.onrender.com';
// ======================================================
const DISTRICTS={almazar:'Алмазарский',bektemir:'Бектемирский',mirabad:'Мирабадский',mirzo_ulugbek:'Мирзо-Улугбекский',sergeli:'Сергелийский',uchtepa:'Учтепинский',chilanzar:'Чиланзарский',shaykhontohur:'Шайхантахурский',yunusabad:'Юнусабадский',yakkasaray:'Яккасарайский',yashnabad:'Яшнабадский',yangihayot:'Янгихаётский'};
const TYPES={trash:'🗑 Урна / мусор',light:'💡 Фонарь',road:'🕳 Яма / дорога',playground:'🛝 Площадка',water:'💧 Вода',other:'⚠️ Другое'};
const ST={new:'Новая',review:'На проверке',in_progress:'В работе',resolved:'Решена'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'});
const pill=s=>`<span class="pill" style="--c:var(--c-${s})"><i class="dot"></i>${ST[s]}</span>`;
const tchip=t=>{const [e,...n]=(TYPES[t]||'⚠️ '+t).split(' ');return `<span class="tchip"><i>${e}</i>${esc(n.join(' '))}</span>`};
const sid=i=>String(i).slice(-6);
const opts=(m,sel='')=>Object.entries(m).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${esc(v)}</option>`).join('');
const tok=()=>{try{return localStorage.getItem('tf_token')}catch(e){return null}};
function logout(){try{localStorage.removeItem('tf_token')}catch(e){}location.hash='';route()}
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('tf_theme',t)}catch(e){}$('th').textContent=t==='dark'?'☀':'☾'}

async function api(path,o={},blob=false){
  const r=await fetch(API+path,{...o,headers:{'Content-Type':'application/json',...(tok()?{Authorization:'Bearer '+tok()}:{})}});
  if(r.status===401&&path!=='/api/auth/login'){logout();throw new Error('Сессия истекла')}
  if(blob){if(!r.ok)throw new Error('Ошибка '+r.status);return r.blob()}
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Ошибка '+r.status);return d;
}

function viewLogin(){
  $('app').innerHTML=`<div class="login"><form id="lf" class="stack"><div class="logo" style="font-size:22px;margin-bottom:6px"><i class="mark"></i>TashFix</div><p class="mut sm" style="margin:0 0 10px">Панель управления жалобами</p>
  <input id="u" placeholder="Логин" autocomplete="username" required><input id="p" type="password" placeholder="Пароль" autocomplete="current-password" required>
  <div id="le"></div><button class="btn" style="width:100%">Войти</button></form></div>`;
  $('lf').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;b.textContent='Вход…';
    try{const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('u').value,password:$('p').value})});
      localStorage.setItem('tf_token',r.token);location.hash='#/';route()}
    catch(x){$('le').innerHTML=`<div class="err">${esc(x.message)}</div>`;b.disabled=false;b.textContent='Войти'}};
}

function shell(h){
  const dark=document.documentElement.dataset.theme==='dark';
  $('app').innerHTML=`<header><div class="wrap nav"><span class="logo"><i class="mark"></i>TashFix</span>
  <a class="l ${h==='/'?'on':''}" href="#/">Обзор</a><a class="l ${h!=='/'?'on':''}" href="#/problems">Жалобы</a><span class="sp"></span>
  <button class="btn ghost" id="th" style="padding:6px 12px">${dark?'☀':'☾'}</button><button class="btn ghost" id="lo" style="padding:6px 12px">Выйти</button></div></header>
  <main class="wrap" id="main"></main>`;
  $('th').onclick=toggleTheme;$('lo').onclick=logout;
}

async function viewDashboard(){
  const [s,rows]=await Promise.all([api('/api/stats'),api('/api/problems')]);
  const card=(t,n,c)=>`<div class="card stat" style="--c:${c||'var(--ac)'}"><div class="t"><i class="dot"></i>${t}</div><div class="n">${n}</div></div>`;
  const by={};rows.forEach(p=>{const v=by[p.district]||(by[p.district]={new:0,review:0,in_progress:0,resolved:0,t:0});v[p.status]++;v.t++});
  const list=Object.entries(by).sort((a,b)=>b[1].t-a[1].t),max=list.length?list[0][1].t:1;
  const bars=list.map(([d,v])=>`<div class="bar-row"><span>${esc(DISTRICTS[d]||d)}</span><div class="bar" style="width:${v.t/max*100}%">${Object.keys(ST).map(k=>v[k]?`<i style="flex:${v[k]};background:var(--c-${k})" title="${ST[k]}: ${v[k]}"></i>`:'').join('')}</div><b>${v.t}</b></div>`).join('');
  $('main').innerHTML=`<h1>Обзор</h1><p class="sub">Сводка по обращениям жителей Ташкента</p><div class="grid g4">${card('Всего',s.total)}${card('Новые',s.byStatus.new,'var(--c-new)')}${card('В работе',s.byStatus.in_progress,'var(--c-in_progress)')}${card('Решено',s.resolved,'var(--c-resolved)')}</div>
  <div class="card" style="margin-top:16px"><h3>Жалобы по районам и статусам</h3>${bars||'<p class="mut">Пока нет данных</p>'}
  <div class="legend">${Object.keys(ST).map(k=>`<span class="pill" style="--c:var(--c-${k})"><i class="dot"></i>${ST[k]}</span>`).join('')}</div></div>`;
}

async function viewList(){
  $('main').innerHTML=`<h1>Жалобы</h1><p class="sub">Все обращения, пришедшие через бота</p><div class="filters"><input id="q" placeholder="Поиск по адресу и описанию"><select id="fd"><option value="">Все районы</option>${opts(DISTRICTS)}</select><select id="fs"><option value="">Все статусы</option>${opts(ST)}</select></div><div class="card tw" id="tbl"></div>`;
  let cache=[];
  const draw=()=>{const q=$('q').value.trim().toLowerCase();
    const rows=cache.filter(p=>!q||(p.address+' '+p.description).toLowerCase().includes(q));
    $('tbl').innerHTML=rows.length?`<table><thead><tr><th>№</th><th>Тип</th><th>Район и адрес</th><th>Статус</th><th>Подтв.</th><th>Дата</th></tr></thead><tbody>${rows.map(p=>`<tr onclick="location.hash='#/problems/${p._id}'"><td class="num">#${sid(p._id)}</td><td>${tchip(p.type)}</td><td>${esc(DISTRICTS[p.district]||p.district)}<div class="mut sm">${esc(p.address)}</div></td><td>${pill(p.status)}</td><td>${p.confirmCount}</td><td class="mut sm" style="white-space:nowrap">${fmt(p.createdAt)}</td></tr>`).join('')}</tbody></table>`:'<p class="mut" style="padding:20px">Ничего не найдено</p>'};
  const load=async()=>{const u=new URLSearchParams();if($('fd').value)u.set('district',$('fd').value);if($('fs').value)u.set('status',$('fs').value);
    $('tbl').innerHTML='<p class="mut" style="padding:20px">Загрузка…</p>';
    try{cache=await api('/api/problems?'+u);draw()}catch(e){$('tbl').innerHTML=`<p class="err" style="padding:20px">${esc(e.message)}</p>`}};
  $('q').oninput=draw;$('fd').onchange=load;$('fs').onchange=load;await load();
}

async function viewDetail(id){
  const p=await api('/api/problems/'+id);
  const hist=(p.statusHistory||[]).slice().reverse().map(h=>`<li style="--c:var(--c-${h.status})">${pill(h.status)} <span class="mut sm">${fmt(h.changedAt)}</span>${h.note?`<div class="sm" style="margin-top:4px">${esc(h.note)}</div>`:''}</li>`).join('');
  const del=p.status==='resolved'?'<button type="button" class="btn danger" id="del">Удалить жалобу</button>':'<p class="mut sm" style="margin:0">Удалить можно только решённую жалобу.</p>';
  $('main').innerHTML=`<a class="back" href="#/problems">← Все жалобы</a><div class="grid g2" style="align-items:start">
  <div class="card stack"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px">${tchip(p.type)}<span class="num">#${sid(p._id)}</span></div>${pill(p.status)}
  <div>📍 ${esc(DISTRICTS[p.district]||p.district)}, ${esc(p.address)}</div><div style="white-space:pre-wrap">${esc(p.description)}</div>
  <div class="mut sm">Автор: ${esc(p.reporterName||'—')} · Подтвердили: ${p.confirmCount} · ${fmt(p.createdAt)}</div><div id="ph">${p.hasPhoto?'<span class="mut sm">Загрузка фото…</span>':''}</div></div>
  <div class="stack"><form id="sf" class="card stack"><h3>Сменить статус</h3><select id="ns">${opts(ST,p.status)}</select>
  <textarea id="nn" rows="3" maxlength="500" placeholder="Сообщение жителям (необязательно)"></textarea><div id="sm"></div>
  <button class="btn">Сохранить и уведомить</button><p class="mut sm" style="margin:0">Уведомление получат жители этого района, которые сообщали или подтверждали жалобы.</p></form>
  <div class="card"><h3>История</h3><ul class="hist">${hist}</ul></div><div class="card">${del}<div id="dm"></div></div></div></div>`;
  if(p.hasPhoto)api(`/api/problems/${id}/photo`,{},true).then(b=>{$('ph').innerHTML=`<img class="ph" src="${URL.createObjectURL(b)}" alt="">`}).catch(e=>{$('ph').innerHTML=`<span class="err">Фото: ${esc(e.message)}</span>`});
  $('sf').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;
    try{await api(`/api/problems/${id}/status`,{method:'PATCH',body:JSON.stringify({status:$('ns').value,note:$('nn').value})});await viewDetail(id);$('sm').innerHTML='<div class="ok">Сохранено, жители уведомлены</div>'}
    catch(x){$('sm').innerHTML=`<div class="err">${esc(x.message)}</div>`;b.disabled=false}};
  if($('del'))$('del').onclick=async()=>{if(!confirm('Удалить жалобу #'+sid(id)+' навсегда?'))return;
    try{await api('/api/problems/'+id,{method:'DELETE'});location.hash='#/problems'}catch(x){$('dm').innerHTML=`<div class="err">${esc(x.message)}</div>`}};
}

async function route(){
  if(!tok())return viewLogin();
  const h=location.hash.replace(/^#/,'')||'/';shell(h);
  const m=h.match(/^\/problems\/([a-f0-9]{24})$/);
  try{if(m)await viewDetail(m[1]);else if(h==='/problems')await viewList();else await viewDashboard()}
  catch(e){$('main').innerHTML=`<div class="err">${esc(e.message)}</div>`}
}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
