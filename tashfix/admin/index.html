<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TashFix — панель</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
<div id="app"></div>
<script>
// ====== НАСТРОЙКА: адрес твоего бэкенда на Render (без слэша в конце) ======
const API = 'https://tashfix-0.onrender.com';
// ===========================================================================

const DISTRICTS = {
  almazar:'Алмазарский', bektemir:'Бектемирский', mirabad:'Мирабадский', mirzo_ulugbek:'Мирзо-Улугбекский',
  sergeli:'Сергелийский', uchtepa:'Учтепинский', chilanzar:'Чиланзарский', shaykhontohur:'Шайхантахурский',
  yunusabad:'Юнусабадский', yakkasaray:'Яккасарайский', yashnabad:'Яшнабадский', yangihayot:'Янгихаётский'
};
const TYPES = {
  trash:'🗑 Урна / мусор', light:'💡 Фонарь', road:'🕳 Яма / дорога',
  playground:'🛝 Площадка', water:'💧 Вода', other:'⚠️ Другое'
};
const STATUSES = {
  new:['🆕 Новая','bg-slate-200 text-slate-700'],
  review:['🔍 На проверке','bg-amber-100 text-amber-800'],
  in_progress:['🛠 В работе','bg-blue-100 text-blue-800'],
  resolved:['✅ Решена','bg-green-100 text-green-800']
};

const $ = (id) => document.getElementById(id);
const esc = (s = '') => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (d) => new Date(d).toLocaleString('ru-RU', { dateStyle: 'short', timeStyle: 'short' });
const badge = (s) => `<span class="px-2 py-0.5 rounded-full text-xs font-medium ${STATUSES[s][1]}">${STATUSES[s][0]}</span>`;
const sid = (id) => String(id).slice(-6);
const errBox = (m) => `<div class="p-3 rounded bg-red-50 text-red-700 text-sm">${esc(m)}</div>`;
const opts = (map, sel = '') => Object.entries(map).map(([k, v]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${esc(Array.isArray(v) ? v[0] : v)}</option>`).join('');

const getToken = () => localStorage.getItem('tf_token');
function logout() { localStorage.removeItem('tf_token'); location.hash = ''; route(); }

async function api(path, options = {}, raw = false) {
  const res = await fetch(API + path, {
    ...options,
    headers: { 'Content-Type': 'application/json', ...(getToken() ? { Authorization: 'Bearer ' + getToken() } : {}) }
  });
  if (res.status === 401 && path !== '/api/auth/login') { logout(); throw new Error('Сессия истекла, войдите снова'); }
  if (raw) { if (!res.ok) throw new Error('Ошибка ' + res.status); return res.blob(); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Ошибка ' + res.status);
  return data;
}

// ---------- логин ----------
function viewLogin() {
  $('app').innerHTML = `
  <div class="min-h-screen flex items-center justify-center p-4">
    <form id="lf" class="bg-white rounded-xl shadow p-6 w-full max-w-sm space-y-4">
      <h1 class="text-xl font-bold">TashFix · панель</h1>
      <input id="u" class="w-full border rounded px-3 py-2" placeholder="Логин" autocomplete="username" required>
      <input id="p" type="password" class="w-full border rounded px-3 py-2" placeholder="Пароль" autocomplete="current-password" required>
      <div id="le"></div>
      <button class="w-full bg-slate-900 text-white rounded py-2 font-medium">Войти</button>
    </form>
  </div>`;
  $('lf').onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button'); btn.disabled = true; btn.textContent = 'Вход… (сервер может просыпаться)';
    try {
      const r = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ username: $('u').value, password: $('p').value }) });
      localStorage.setItem('tf_token', r.token); location.hash = '#/'; route();
    } catch (err) { $('le').innerHTML = errBox(err.message); btn.disabled = false; btn.textContent = 'Войти'; }
  };
}

// ---------- каркас ----------
function shell() {
  $('app').innerHTML = `
  <header class="bg-slate-900 text-white">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-6">
      <b>TashFix</b>
      <a href="#/" class="text-sm hover:underline">Дашборд</a>
      <a href="#/problems" class="text-sm hover:underline">Проблемы</a>
      <button id="lo" class="ml-auto text-sm hover:underline">Выйти</button>
    </div>
  </header>
  <main id="main" class="max-w-6xl mx-auto p-4"><p class="text-slate-500">Загрузка…</p></main>`;
  $('lo').onclick = logout;
}

// ---------- дашборд ----------
async function viewDashboard() {
  const s = await api('/api/stats');
  const card = (t, n, c) => `<div class="bg-white rounded-xl shadow p-4"><div class="text-sm text-slate-500">${t}</div><div class="text-3xl font-bold ${c}">${n}</div></div>`;
  $('main').innerHTML = `
    <h2 class="text-xl font-bold mb-4">Статистика</h2>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      ${card('Всего', s.total, '')}${card('Активные (новые + в работе)', s.active, 'text-blue-700')}
      ${card('На проверке', s.review, 'text-amber-600')}${card('Решено', s.resolved, 'text-green-600')}
    </div>
    <a href="#/problems" class="inline-block mt-6 bg-slate-900 text-white rounded px-4 py-2 text-sm">Все проблемы →</a>`;
}

// ---------- список ----------
async function viewList() {
  $('main').innerHTML = `
    <h2 class="text-xl font-bold mb-4">Проблемы</h2>
    <div class="flex flex-wrap gap-3 mb-4">
      <select id="fd" class="border rounded px-3 py-2 bg-white"><option value="">Все районы</option>${opts(DISTRICTS)}</select>
      <select id="fs" class="border rounded px-3 py-2 bg-white"><option value="">Все статусы</option>${opts(STATUSES)}</select>
    </div>
    <div id="tbl" class="bg-white rounded-xl shadow overflow-x-auto"></div>`;
  async function load() {
    const q = new URLSearchParams();
    if ($('fd').value) q.set('district', $('fd').value);
    if ($('fs').value) q.set('status', $('fs').value);
    $('tbl').innerHTML = '<p class="p-4 text-slate-500">Загрузка…</p>';
    const rows = await api('/api/problems?' + q);
    $('tbl').innerHTML = rows.length ? `
      <table class="w-full text-sm">
        <thead class="text-left text-slate-500 border-b"><tr>
          <th class="p-3">№</th><th class="p-3">Тип</th><th class="p-3">Район / адрес</th>
          <th class="p-3">Статус</th><th class="p-3">👥</th><th class="p-3">Создана</th></tr></thead>
        <tbody>${rows.map((p) => `
          <tr class="border-b hover:bg-slate-50 cursor-pointer" onclick="location.hash='#/problems/${p._id}'">
            <td class="p-3">#${sid(p._id)}</td><td class="p-3">${esc(TYPES[p.type] || p.type)}</td>
            <td class="p-3">${esc(DISTRICTS[p.district] || p.district)}<div class="text-slate-500">${esc(p.address)}</div></td>
            <td class="p-3">${badge(p.status)}</td><td class="p-3">${p.confirmCount}</td>
            <td class="p-3 whitespace-nowrap">${fmt(p.createdAt)}</td></tr>`).join('')}
        </tbody></table>` : '<p class="p-4 text-slate-500">Проблем не найдено</p>';
  }
  const safe = () => load().catch((e) => ($('tbl').innerHTML = errBox(e.message)));
  $('fd').onchange = safe; $('fs').onchange = safe;
  await load();
}

// ---------- карточка ----------
async function viewDetail(id) {
  const p = await api('/api/problems/' + id);
  const hist = (p.statusHistory || []).slice().reverse().map((h) => `
    <li class="border-l-2 pl-3 pb-3"><div>${badge(h.status)} <span class="text-xs text-slate-500">${fmt(h.changedAt)}</span></div>
    ${h.note ? `<div class="text-sm mt-1">💬 ${esc(h.note)}</div>` : ''}</li>`).join('');
  $('main').innerHTML = `
    <a href="#/problems" class="text-sm text-slate-500 hover:underline">← К списку</a>
    <div class="grid md:grid-cols-2 gap-4 mt-3">
      <section class="bg-white rounded-xl shadow p-4 space-y-2">
        <h2 class="text-lg font-bold">${esc(TYPES[p.type] || p.type)} <span class="text-slate-400">#${sid(p._id)}</span></h2>
        <div>${badge(p.status)}</div>
        <div>📍 ${esc(DISTRICTS[p.district] || p.district)}, ${esc(p.address)}</div>
        <div class="whitespace-pre-wrap">${esc(p.description)}</div>
        <div class="text-sm text-slate-500">Автор: ${esc(p.reporterName || '—')} (id ${p.reporterTelegramId})</div>
        <div class="text-sm text-slate-500">Подтвердили: ${p.confirmCount} · Создана: ${fmt(p.createdAt)}</div>
        <div id="photo">${p.hasPhoto ? '<p class="text-slate-400 text-sm">Загрузка фото…</p>' : ''}</div>
      </section>
      <section class="space-y-4">
        <form id="sf" class="bg-white rounded-xl shadow p-4 space-y-3">
          <h3 class="font-bold">Сменить статус</h3>
          <select id="ns" class="w-full border rounded px-3 py-2 bg-white">${opts(STATUSES, p.status)}</select>
          <textarea id="nn" maxlength="500" rows="3" class="w-full border rounded px-3 py-2" placeholder="Сообщение жителям (необязательно)"></textarea>
          <div id="sm"></div>
          <button class="bg-slate-900 text-white rounded px-4 py-2 text-sm font-medium">Сохранить и уведомить</button>
          <p class="text-xs text-slate-500">Уведомление получат все, кто сообщал или подтверждал проблемы в этом районе.</p>
        </form>
        <div class="bg-white rounded-xl shadow p-4"><h3 class="font-bold mb-3">История</h3><ul>${hist}</ul></div>
      </section>
    </div>`;
  if (p.hasPhoto) {
    api(`/api/problems/${id}/photo`, {}, true)
      .then((b) => { $('photo').innerHTML = `<img src="${URL.createObjectURL(b)}" class="rounded-lg max-h-96 mt-2" alt="Фото">`; })
      .catch((e) => { $('photo').innerHTML = errBox('Фото: ' + e.message); });
  }
  $('sf').onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button'); btn.disabled = true;
    try {
      await api(`/api/problems/${id}/status`, { method: 'PATCH', body: JSON.stringify({ status: $('ns').value, note: $('nn').value }) });
      await viewDetail(id);
      $('sm').innerHTML = '<div class="p-3 rounded bg-green-50 text-green-700 text-sm">Сохранено, рассылка жителям запущена</div>';
    } catch (err) { $('sm').innerHTML = errBox(err.message); btn.disabled = false; }
  };
}

// ---------- роутер ----------
async function route() {
  if (!getToken()) return viewLogin();
  shell();
  const h = location.hash.replace(/^#/, '') || '/';
  const m = h.match(/^\/problems\/([a-f0-9]{24})$/);
  try {
    if (m) await viewDetail(m[1]);
    else if (h === '/problems') await viewList();
    else await viewDashboard();
  } catch (e) { if ($('main')) $('main').innerHTML = errBox(e.message); }
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
